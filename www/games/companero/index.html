<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF6EF">
<title>همراه من — کاپیبارا</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../lib/chogan.css">
<style>
  /* Capybara's companion (epic #2). Design tokens only, like every game. */
  .cp { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-4); padding: var(--s-3); }
  .cp-compa { display: flex; justify-content: center; padding: var(--s-4) 0; background: var(--c-surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
  .cp-compa svg { width: min(46vw, 200px); height: auto; }
  .cp-aviso { margin: 0; padding: var(--s-3); border-radius: var(--r-md); background: var(--game-soft, var(--c-surface)); text-align: center; }
  .cp-seccion h2 { margin: 0 0 var(--s-2); font-size: 1.05rem; }
  .cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s-2); }
  .cp-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s-2); min-height: 44px;
    border: 2px solid transparent; border-radius: var(--r-md); background: var(--c-surface); color: inherit; font: inherit; cursor: pointer; }
  .cp-item svg { width: 56px; height: auto; }
  .cp-item[aria-pressed="true"] { border-color: var(--game); }
  .cp-item:focus-visible { outline: 3px solid var(--game); outline-offset: 2px; }
  .cp-nota { font-size: .8rem; opacity: .75; }
</style>
</head>
<body>
<script src="../../version.js"></script>
<script src="../../lib/chogan.js"></script>
<script src="economia.js"></script>
<script src="arte.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Chogan, el = C.el;

  /* ==== TEXTOS START ==== */
  var TEXTOS = {
    fa: { monedas: 'سکه', animales: 'حیوان‌ها', colores: 'رنگ‌ها', ropa: 'لباس‌ها', cuidado: 'مراقبت',
      cargando: 'همراهت را آماده می‌کنیم…', vacio: 'هنوز اینجا چیزی نیست.', sinMonedas: 'هنوز سکه نداری. یک بازی کن تا سکه بگیری.', equipado: 'در حال استفاده',
      a_fox: 'روباه', a_owl: 'جغد', a_cat: 'گربه', a_bear: 'خرس', a_capybara: 'کاپیبارا', a_conejo: 'خرگوش', a_panda: 'پاندا', a_nutria: 'سمور آبی' },
    en: { monedas: 'Coins', animales: 'Animals', colores: 'Colours', ropa: 'Clothes', cuidado: 'Care',
      cargando: 'Getting your companion ready…', vacio: 'Nothing here yet.', sinMonedas: 'You have no coins yet. Play a game to earn some.', equipado: 'In use',
      a_fox: 'Fox', a_owl: 'Owl', a_cat: 'Cat', a_bear: 'Bear', a_capybara: 'Capybara', a_conejo: 'Rabbit', a_panda: 'Panda', a_nutria: 'Otter' },
    zh: { monedas: '金币', animales: '动物', colores: '颜色', ropa: '服装', cuidado: '照顾',
      cargando: '正在准备你的伙伴……', vacio: '这里还没有东西。', sinMonedas: '你还没有金币。玩一局就能赚到。', equipado: '使用中',
      a_fox: '狐狸', a_owl: '猫头鹰', a_cat: '猫', a_bear: '熊', a_capybara: '水豚', a_conejo: '兔子', a_panda: '熊猫', a_nutria: '水獭' },
    de: { monedas: 'Münzen', animales: 'Tiere', colores: 'Farben', ropa: 'Kleidung', cuidado: 'Pflege',
      cargando: 'Dein Begleiter wird vorbereitet …', vacio: 'Hier ist noch nichts.', sinMonedas: 'Du hast noch keine Münzen. Spiel eine Runde, um welche zu verdienen.', equipado: 'In Gebrauch',
      a_fox: 'Fuchs', a_owl: 'Eule', a_cat: 'Katze', a_bear: 'Bär', a_capybara: 'Wasserschwein', a_conejo: 'Hase', a_panda: 'Panda', a_nutria: 'Otter' },
    es: { monedas: 'Monedas', animales: 'Animales', colores: 'Colores', ropa: 'Ropa', cuidado: 'Cuidado',
      cargando: 'Preparando a tu compañero…', vacio: 'Todavía no hay nada aquí.', sinMonedas: 'Todavía no tienes monedas. Juega una partida para ganarlas.', equipado: 'En uso',
      a_fox: 'Zorro', a_owl: 'Búho', a_cat: 'Gato', a_bear: 'Oso', a_capybara: 'Capibara', a_conejo: 'Conejo', a_panda: 'Panda', a_nutria: 'Nutria' }
  };
  /* ==== TEXTOS END ==== */

  C.boot({});
  var ctx = C.game({
    id: 'companero',
    name: { fa: 'همراه من', en: 'My companion', zh: '我的伙伴', de: 'Mein Begleiter', es: 'Mi compañero' },
    accent: '#E9B486',
    mood: 'menu',
    scroll: true,
    strings: TEXTOS
  });

  // Every game page reads its saved match (#132). The companion has no match to resume: its
  // state lives in the economy's own store, so this only keeps the contract.
  ctx.loadSave();

  var E = window.CompaneroEconomia.crear({
    store: ctx.store,
    coins: C.coins,
    nucleo: function () { return { unlocks: C.state.unlocks, mascot: C.state.settings.mascot }; }
  });
  var ARTE = window.CompaneroArte;
  // The core's characters: in this piece the companion shows the ones the player owns (#6 adds the new four)
  var ANIMALES = ['fox', 'owl', 'cat', 'bear'];

  var estado = el('p', { class: 'cp-aviso', 'data-estado': 'cargando', role: 'status', text: C.t('cargando') });
  var compa = el('div', { class: 'cp-compa', 'aria-live': 'polite' });
  var sinMonedas = el('p', { class: 'cp-aviso', 'data-estado': 'sin-monedas', hidden: true, text: C.t('sinMonedas') });
  var grid = el('div', { class: 'cp-grid' });

  function seccion(id, contenido, visible) {
    var titulo = el('h2', { id: 'cp-' + id, text: C.t(id) });
    var s = el('section', { class: 'cp-seccion', 'data-seccion': id, 'aria-labelledby': 'cp-' + id }, [titulo].concat(contenido));
    // colours, clothes and care wait for #7, #8 and #9: present for the structure, never announced
    if (!visible) s.hidden = true;
    return s;
  }
  var vacio = function () { return el('p', { class: 'cp-nota', 'data-estado': 'vacio', text: C.t('vacio') }); };

  var raiz = el('div', { class: 'cp' }, [
    estado, compa, sinMonedas,
    seccion('animales', [grid], true),
    seccion('colores', [vacio()], false),
    seccion('ropa', [vacio()], false),
    seccion('cuidado', [vacio()], false)
  ]);
  ctx.stat('monedas', C.t('monedas'));
  ctx.main.appendChild(raiz);
  ctx.mount();

  function render() {
    var eq = E.equipado();
    compa.innerHTML = ARTE.cuerpos[eq.animal] || ARTE.cuerpos.fox;
    var svg = compa.querySelector('svg');
    if (svg) { svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', C.t('a_' + eq.animal)); }

    grid.innerHTML = '';
    ANIMALES.filter(E.poseido).forEach(function (id) {
      var puesto = eq.animal === id;
      var b = el('button', { class: 'cp-item', type: 'button', 'data-animal': id, 'aria-pressed': puesto ? 'true' : 'false' });
      b.innerHTML = ARTE.cuerpos[id];
      b.appendChild(el('span', { text: C.t('a_' + id) }));
      if (puesto) b.appendChild(el('span', { class: 'cp-nota', text: C.t('equipado') }));
      b.addEventListener('click', function () {
        if (E.equipar(id).ok) { C.feedback('tap'); render(); grid.querySelector('[data-animal="' + id + '"]').focus(); }
      });
      grid.appendChild(b);
    });

    var monedas = C.coins.get();
    ctx.setStat('monedas', C.num ? C.num(monedas) : monedas);
    sinMonedas.hidden = monedas > 0;
    estado.hidden = true;
  }
  render();
})();
</script>
</body>
</html>
