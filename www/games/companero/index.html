<style>
  /* Capybara's companion (epic #2). Design tokens only, like every game. */
  .cp { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-4); padding: var(--s-3); }
  /* The stage stays on screen while the options scroll under it (#31): a care or a purchase is
     always seen. The game bar above it already keeps the coins in view. */
  /* top: the game area's own top padding, so it sticks right under the bar with no gap for the options to show through */
  .cp-escenario { position: sticky; top: calc(-1 * var(--s-3)); z-index: 2; display: flex; flex-direction: column; gap: var(--s-2);
    margin: calc(-1 * var(--s-3)) calc(-1 * var(--s-3)) 0; padding: var(--s-3) var(--s-3) var(--s-2); background: var(--c-bg); }
  .cp-compa { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--s-1, 4px); padding: var(--s-5) 0 var(--s-2); background: var(--c-surface);
    border-radius: var(--r-lg); box-shadow: var(--sh-1); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cp-compa:focus-visible { outline: 3px solid var(--game); outline-offset: 2px; }
  .cp-dibujo svg { width: min(34vw, 150px); height: auto; display: block; }
  @media (max-height: 600px) { .cp-dibujo svg { width: 100px; } .cp-compa { padding-top: var(--s-4); } }
  /* one row per section that slides sideways, card by card */
  .cp-fila { display: flex; gap: var(--s-2); overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory;
    scroll-padding-inline: 2px; padding: 2px 2px var(--s-2); scrollbar-width: thin; }
  .cp-fila > .cp-item { flex: 0 0 96px; scroll-snap-align: start; }
  .cp-aviso { margin: 0; padding: var(--s-3); border-radius: var(--r-md); background: var(--game-soft, var(--c-surface)); text-align: center; }
  .cp-seccion h2 { margin: 0 0 var(--s-2); font-size: 1.05rem; }
  .cp-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s-2); min-height: 44px;
    border: 2px solid transparent; border-radius: var(--r-md); background: var(--c-surface); color: inherit; font: inherit; cursor: pointer; }
  .cp-item svg { width: 56px; height: auto; }
  /* a long name never leaves its card: it breaks at its soft hyphen (Wasser\u00ADschwein), or anywhere if it has none */
  .cp-item > span { max-width: 100%; text-align: center; hyphens: auto; overflow-wrap: anywhere; }
  .cp-item[aria-pressed="true"] { border-color: var(--game); }
  .cp-item:focus-visible { outline: 3px solid var(--game); outline-offset: 2px; }
  .cp-nota { font-size: .8rem; opacity: .75; }
  .cp-item--falta svg { opacity: .55; filter: grayscale(.4); }
  .cp-precio { font-weight: 600; opacity: 1; }
  .cp-ropa { display: flex; flex-direction: column; gap: var(--s-2); }
  .cp-subtitulo { margin: var(--s-2) 0 0; font-size: .9rem; opacity: .8; }
  /* the wish floats over the top of the card, so showing or hiding it never moves the companion */
  .cp-globo { position: absolute; top: var(--s-2); inset-inline: var(--s-3); z-index: 1; margin: 0 auto; width: fit-content; max-width: calc(100% - 2 * var(--s-3));
    padding: var(--s-2) var(--s-3); border-radius: var(--r-lg); background: var(--c-surface); box-shadow: var(--sh-2, var(--sh-1));
    text-align: center; font-weight: 600; transition: opacity .3s ease, visibility .3s; }
  .cp-globo[data-visible="0"] { opacity: 0; visibility: hidden; }
  @media (prefers-reduced-motion: reduce) { .cp-globo { transition: none; } }
  .cp-globo[data-cumplido="1"] { border: 2px solid var(--game); }
  .cp-vinculo { margin: 0; text-align: center; font-size: .9rem; }
  .cp-corazones { color: #D7263D; letter-spacing: 2px; }
  .cp-accion { min-height: 56px; justify-content: center; font-weight: 600; }
  .cp-emoji { font-size: 1.8rem; line-height: 1; }
  @keyframes cp-salto { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-8%); } }
  .cp-salto { animation: cp-salto .5s ease; }
  @media (prefers-reduced-motion: reduce) { .cp-salto { animation: none; } }
</style>

  ctx.loadSave();

  var E = window.CompaneroEconomia.crear({
    store: ctx.store,
    coins: C.coins,
    nucleo: function () { return { unlocks: C.state.unlocks, mascot: C.state.settings.mascot }; }
  });
  var ARTE = window.CompaneroArte;
  var K = window.CompaneroCuidado.crear({ store: ctx.store, economia: E });
  K.visitar();   // each opening is a visit: one kind wish, never the last visit's
  var CONSUMIBLES = ['fruta', 'zanahoria', 'pastel', 'jabon'];
  // the face of the moment: the opening one, or a short-lived one after something happens
  var momento = null, relojMomento = null, relojSueno = null;
  // The eight animals, the capybara first. The core's own (fox, owl, cat, bear) are bought in the
  // core's shop and only read here (#3); the new ones are bought in the companion (#6).
  var ANIMALES = ['capybara', 'fox', 'owl', 'cat', 'bear', 'conejo', 'panda', 'nutria'];
  var NUCLEO = ['fox', 'owl', 'cat', 'bear'];

  var aplicar = function (svg, animal, diseno) { return window.CompaneroDisenos.aplicar(svg, animal, diseno, DISENOS); };

  var ESPACIOS = ['cabeza', 'cuello', 'cuerpo'];

  // the expression first, then the design, and the clothes last (#9): a design never recolours a
  // garment, and the face changes only its eyes and mouth
  var vestir = function (animal, diseno, prendas, expresion) {
    var ids = ESPACIOS.map(function (e) { return prendas[e]; }).filter(Boolean);
    var cuerpo = ARTE.cuerpos[animal] || ARTE.cuerpos.fox;
    if (expresion) cuerpo = window.CompaneroExpresiones.expresar(cuerpo, animal, expresion, ARTE.expresiones);
    return window.CompaneroPrendas.componer(aplicar(cuerpo, animal, diseno), animal, ids, PRENDAS);
  };

    if (tiene) return C.t('ariaTuyo', { nombre: nombre });
    if (perfil) return C.t('ariaPerfil', { nombre: nombre });
    return C.t('ariaPrecio', { nombre: nombre, precio: C.t('precio', { n: C.num(precio) }) });
  };

  var cuidado = el('div', { class: 'cp-fila' });
  var globo = el('p', { class: 'cp-globo', role: 'status', 'aria-live': 'polite' });
  var vinculo = el('p', { class: 'cp-vinculo' });

    if (!visible) s.hidden = true;
    return s;

  compa.appendChild(globo);
  compa.appendChild(lienzo);
  compa.appendChild(vinculo);
  var raiz = el('div', { class: 'cp' }, [
    el('div', { class: 'cp-escenario' }, [estado, compa]),
    sinMonedas,
    seccion('cuidado', [cuidado], true),
    seccion('animales', [grid], true),
    seccion('colores', [gridDisenos], true),
    seccion('ropa', [ropa], true)
  ]);
  ctx.stat('monedas', C.t('monedas'));
  ctx.main.appendChild(raiz);
  ctx.mount();

  function render() {
    var eq = E.equipado();
    var cara = momento || K.expresionAlAbrir();
    lienzo.innerHTML = vestir(eq.animal, eq.diseno, eq.prendas, cara);
    compa.dataset.expresion = cara;

    var deseo = K.deseo();
    if (deseo) {
      globo.dataset.deseo = deseo.id;
      globo.dataset.cumplido = deseo.cumplido ? '1' : '0';
      globo.textContent = deseo.cumplido ? C.t('deseoCumplido') : C.t('deseo_' + deseo.id);
    }
    var v = K.vinculo();
    vinculo.dataset.vinculo = String(v.puntos);
    vinculo.textContent = '';
    vinculo.appendChild(el('span', { class: 'cp-corazones', 'aria-hidden': 'true', text: new Array(v.nivel + 1).join('♥') + new Array(v.niveles - v.nivel + 1).join('♡') }));
    vinculo.appendChild(el('span', { text: ' ' + C.t('vinculo', { n: C.num(v.nivel), m: C.num(v.niveles) }) }));
    var svg = lienzo.querySelector('svg');
    if (svg) { svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', C.t('a_' + eq.animal)); }

    grid.innerHTML = '';
    ANIMALES.forEach(function (id) {
      var tiene = E.poseido(id), puesto = eq.animal === id, delNucleo = NUCLEO.indexOf(id) >= 0;
      var b = el('button', { class: 'cp-item', type: 'button', 'data-animal': id, 'data-tiene': tiene ? '1' : '0',
        'aria-pressed': puesto ? 'true' : 'false' });
      if (!tiene && delNucleo) b.setAttribute('data-bloqueado', 'perfil');
      b.setAttribute('aria-label', etiqueta(C.t('a_' + id), tiene, puesto, precioDe[id], !tiene && delNucleo));
      b.innerHTML = ARTE.cuerpos[id];
      var dibujo = b.querySelector('svg');
      if (dibujo) dibujo.setAttribute('aria-hidden', 'true');
      if (!tiene) b.classList.add('cp-item--falta');
      b.appendChild(el('span', { text: C.t('a_' + id) }));
      if (puesto) b.appendChild(el('span', { class: 'cp-nota', text: C.t('equipado') }));
      else if (!tiene && delNucleo) b.appendChild(el('span', { class: 'cp-nota', text: C.t('enPerfil') }));
      else if (!tiene) b.appendChild(el('span', { class: 'cp-nota cp-precio', 'data-precio': String(precioDe[id]), text: C.t('precio', { n: C.num(precioDe[id]) }) }));
      b.addEventListener('click', function () { tocar(id, grid, 'data-animal'); });
      grid.appendChild(b);
    });

    gridDisenos.innerHTML = '';
    DISENOS.disenos.forEach(function (d) {
      var tiene = E.poseido(d.id), puesto = eq.diseno === d.id;
      var b = el('button', { class: 'cp-item', type: 'button', 'data-diseno': d.id, 'data-tiene': tiene ? '1' : '0',
        'aria-pressed': puesto ? 'true' : 'false' });
      b.setAttribute('aria-label', etiqueta(C.t('d_' + d.id), tiene, puesto, precioDe[d.id], false));
      b.innerHTML = aplicar(ARTE.cuerpos[eq.animal] || ARTE.cuerpos.fox, eq.animal, d.id);
      var dibujo = b.querySelector('svg');
      if (dibujo) dibujo.setAttribute('aria-hidden', 'true');
      if (!tiene) b.classList.add('cp-item--falta');
      b.appendChild(el('span', { text: C.t('d_' + d.id) }));
      if (puesto) b.appendChild(el('span', { class: 'cp-nota', text: C.t('equipado') }));
      else if (!tiene) b.appendChild(el('span', { class: 'cp-nota cp-precio', 'data-precio': String(precioDe[d.id]), text: C.t('precio', { n: C.num(precioDe[d.id]) }) }));
      b.addEventListener('click', function () { tocar(d.id, gridDisenos, 'data-diseno'); });
      gridDisenos.appendChild(b);
    });

    // Clothes: one group per slot, a «None» card first, and each garment drawn on the companion
    // as it would look with that garment in its slot
    ropa.innerHTML = '';
    ESPACIOS.forEach(function (espacio) {
      var g = el('div', { class: 'cp-fila', 'data-espacio': espacio, role: 'group', 'aria-label': C.t('e_' + espacio) });
      var nada = el('button', { class: 'cp-item', type: 'button', 'data-ninguna': espacio, 'aria-pressed': eq.prendas[espacio] ? 'false' : 'true' });
      var sinPrenda = {}; ESPACIOS.forEach(function (e) { if (e !== espacio && eq.prendas[e]) sinPrenda[e] = eq.prendas[e]; });
      nada.innerHTML = vestir(eq.animal, eq.diseno, sinPrenda);
      nada.appendChild(el('span', { text: C.t('ninguna') }));
      nada.addEventListener('click', function () { E.quitar(espacio); C.feedback('tap'); render(); enfocar(ropa, 'data-ninguna', espacio); });
      g.appendChild(nada);
      PRENDAS.catalogo.filter(function (p) { return p.espacio === espacio; }).forEach(function (p) {
        var tiene = E.poseido(p.id), puesto = eq.prendas[espacio] === p.id;
        var b = el('button', { class: 'cp-item', type: 'button', 'data-prenda-item': p.id, 'data-tiene': tiene ? '1' : '0',
          'aria-pressed': puesto ? 'true' : 'false', 'aria-label': etiqueta(C.t('p_' + p.id), tiene, puesto, precioDe[p.id], false) });
        var conEsta = {}; ESPACIOS.forEach(function (e) { if (eq.prendas[e]) conEsta[e] = eq.prendas[e]; });
        conEsta[espacio] = p.id;
        b.innerHTML = vestir(eq.animal, eq.diseno, conEsta);
        if (!tiene) b.classList.add('cp-item--falta');
        b.appendChild(el('span', { text: C.t('p_' + p.id) }));
        if (puesto) b.appendChild(el('span', { class: 'cp-nota', text: C.t('equipado') }));
        else if (!tiene) b.appendChild(el('span', { class: 'cp-nota cp-precio', 'data-precio': String(precioDe[p.id]), text: C.t('precio', { n: C.num(precioDe[p.id]) }) }));
        b.addEventListener('click', function () { tocar(p.id, ropa, 'data-prenda-item'); });
        g.appendChild(b);
      });
      ropa.appendChild(el('h3', { class: 'cp-subtitulo', text: C.t('e_' + espacio) }));
      ropa.appendChild(g);
    });
    ropa.querySelectorAll('.cp-item svg').forEach(function (x) { x.setAttribute('aria-hidden', 'true'); });

    // Care: three free actions, then the consumables with what is left of each
    cuidado.innerHTML = '';
    var acciones = cuidado;
    window.CompaneroCuidado.ACCIONES.forEach(function (a) {
      var b = el('button', { class: 'cp-item cp-accion', type: 'button', 'data-accion': a, text: C.t(a) });
      b.addEventListener('click', function () { cuidar({ accion: a }); enfocar(cuidado, 'data-accion', a); });
      acciones.appendChild(b);
    });
    var comida = cuidado;
    CONSUMIBLES.forEach(function (id) {
      var n = E.cantidad(id);
      var b = el('button', { class: 'cp-item', type: 'button', 'data-consumible': id,
        'aria-label': n ? C.t('c_' + id) + ', ' + C.t('cantidad', { n: C.num(n) }) : etiqueta(C.t('c_' + id), false, false, precioDe[id], false) });
      b.appendChild(el('span', { class: 'cp-emoji', 'aria-hidden': 'true', text: { fruta: '🍎', zanahoria: '🥕', pastel: '🍰', jabon: '🫧' }[id] }));
      b.appendChild(el('span', { text: C.t('c_' + id) }));
      b.appendChild(n ? el('span', { class: 'cp-nota', text: C.t('cantidad', { n: C.num(n) }) })
        : el('span', { class: 'cp-nota cp-precio', 'data-precio': String(precioDe[id]), text: C.t('precio', { n: C.num(precioDe[id]) }) }));
      b.addEventListener('click', function () { alimentar(id); });
      comida.appendChild(b);
    });

    var monedas = C.coins.get();
    ctx.setStat('monedas', C.num ? C.num(monedas) : monedas);
    sinMonedas.hidden = monedas > 0;
    estado.hidden = true;
  }
  function enfocar(donde, attr, id) { var b = donde.querySelector('[' + attr + '="' + id + '"]'); if (b) b.focus(); }

  // One way to choose or buy anything in the companion: an animal, a design, and later a garment
  function tocar(id, donde, attr) {
    var esPrenda = attr === 'data-prenda-item';
    if (E.poseido(id)) {
      if (E.equipar(id).ok) {
        C.feedback('tap');
        if (esPrenda) reaccionar(K.hecho({ equipar: 'prenda' })); else render();
        enfocar(donde, attr, id);
      }
      return;
    }
    // the core's characters are bought in its own shop; the companion never writes its unlocks
    if (NUCLEO.indexOf(id) >= 0) { C.ui.toast({ title: C.t('enPerfil') }); return; }
    var precio = precioDe[id];
    if (!C.coins.can(precio)) {
      C.ui.toast({ icon: 'coin', title: C.t('faltan', { n: C.num(precio - C.coins.get()) }), sub: C.t('jugarParaGanar') });
      C.feedback('bad');
      return;
    }
    C.ui.confirm({
      title: C.t('desbloquear', { n: C.num(precio) }),
      okLabel: C.t('desbloquearBtn'),
      onOk: function () {
        if (!E.comprar(id).ok) return;
        E.equipar(id);
        C.feedback('coin');
        var r = esPrenda ? K.hecho({ equipar: 'prenda' }) : null;
        if (r && r.cumplioDeseo) { mostrar('feliz', 2500); mostrarGlobo(); } else mostrar('sorprendido', 2000);
        enfocar(donde, attr, id);
      }
    });
  }

  function reduceMotion() { return !!(C.ui.reduceMotion && C.ui.reduceMotion()); }

  // A face for a few seconds after something happens, then back to the opening one
  function mostrar(cara, ms) {
    momento = cara;
    if (relojMomento) clearTimeout(relojMomento);
    relojMomento = setTimeout(function () { momento = null; render(); }, ms);
    render();
    if (!reduceMotion()) {
      var svg = lienzo.querySelector('svg');
      if (svg) svg.classList.add('cp-salto');
    }
  }
  // Asleep only while the screen stays open and untouched; never because of time away (#9)
  function despertar() {
    if (relojSueno) clearTimeout(relojSueno);
    if (momento === 'dormido') { momento = null; render(); }
    relojSueno = setTimeout(function () { momento = 'dormido'; render(); }, 45000);
  }
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, despertar, true); });
  despertar();

  // The wish shows for a few seconds, on opening, on a tap on the companion and when it is fulfilled;
  // hiding it changes nothing about the wish (#31)
  var relojGlobo = null;
  function mostrarGlobo() {
    globo.dataset.visible = '1';
    if (relojGlobo) clearTimeout(relojGlobo);
    relojGlobo = setTimeout(function () { globo.dataset.visible = '0'; }, 4000);
  }
  compa.addEventListener('click', function () { C.feedback('tap'); mostrarGlobo(); });
  compa.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mostrarGlobo(); }
  });
  // A mouse wheel slides a row sideways while the row can still move that way, then scrolls the page
  raiz.addEventListener('wheel', function (e) {
    var f = e.target.closest && e.target.closest('.cp-fila');
    if (!f || f.scrollWidth <= f.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    var antes = f.scrollLeft;
    f.scrollLeft += e.deltaY;
    if (f.scrollLeft !== antes) e.preventDefault();
  }, { passive: false });

  function reaccionar(r) {
    if (!r || !r.ok) return;
    if (r.cumplioDeseo) mostrarGlobo();
    C.feedback(r.cumplioDeseo ? 'good' : 'tap');
    mostrar('feliz', 2500);
  }
  function cuidar(ev) { reaccionar(K.hecho(ev)); }

  function alimentar(id) {
    if (E.cantidad(id) > 0) { reaccionar(K.alimentar(id)); enfocar(cuidado, 'data-consumible', id); return; }
    var precio = precioDe[id];
    if (!C.coins.can(precio)) {
      C.ui.toast({ icon: 'coin', title: C.t('faltan', { n: C.num(precio - C.coins.get()) }), sub: C.t('jugarParaGanar') });
      C.feedback('bad');
      return;
    }
    C.ui.confirm({
      title: C.t('desbloquear', { n: C.num(precio) }),
      okLabel: C.t('desbloquearBtn'),
      onOk: function () {
        if (!E.comprar(id).ok) return;
        reaccionar(K.alimentar(id));
        enfocar(cuidado, 'data-consumible', id);
      }
    });
  }

  render();
  mostrarGlobo();
})();
</script>
</body>
</html>
