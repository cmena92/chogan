name: Telegram post

# Hand-run posts to the Telegram channel (#258, #263). Every new tag is posted
# by the announce job in release.yml; this is for the rest: one release again,
# the whole history, deleting a post, or setting the channel photo.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release (one tag), history (all, oldest first), edit (rewrite a release post in place), delete (a message), photo (channel photo) or bot-photo (the bot picture)'
        required: true
        default: release
        type: choice
        options: [release, history, edit, delete, photo, bot-photo]
      tag:
        description: 'For release and edit: the tag, e.g. v0.5.2'
        required: false
        type: string
      message_id:
        description: 'For edit and delete: the message number in t.me/chogan_games/<n>'
        required: false
        type: string
      dry_run:
        description: 'Only print what would be sent'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  post:
    name: Telegram ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: |
          case "$MODE" in
            release) tools/telegram-post.sh "$TAG" ;;
            history) tools/telegram-post.sh --history ;;
            edit)    tools/telegram-post.sh --edit "$MESSAGE_ID" "$TAG" ;;
            delete)  tools/telegram-post.sh --delete "$MESSAGE_ID" ;;
            photo)   tools/telegram-post.sh --set-photo ;;
            bot-photo) tools/telegram-post.sh --bot-photo ;;
          esac
